services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: touchee
    ports:
      - '5432:5432'
    volumes:
      - touchee_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - touchee_redisdata:/data
    command: redis-server --appendonly yes

volumes:
  touchee_pgdata:
  touchee_redisdata:
